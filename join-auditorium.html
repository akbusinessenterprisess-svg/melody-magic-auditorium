
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melody Magic - Singer Registration</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:20px;
  background:#090807;color:white;
  font-family:Arial,sans-serif;
}
.container{max-width:600px;margin:25px auto}
h1,h2{color:#e7bd68}
.card{
  background:#191510;
  border:1px solid #705322;
  border-radius:12px;
  padding:22px;margin:18px 0;
}
label{
  display:block;color:#e7bd68;
  margin-top:15px;font-size:14px;
}
input,select{
  width:100%;padding:13px;margin-top:7px;
  background:#0d0b08;color:white;
  border:1px solid #57452c;
  border-radius:6px;font-size:16px;
}
button{
  width:100%;padding:14px;margin-top:22px;
  background:#e7bd68;color:#171009;
  border:0;border-radius:7px;
  font-size:16px;font-weight:bold;
  cursor:pointer;
}
button:disabled{opacity:.5;cursor:wait}
.muted{color:#c2b7a6;line-height:1.6}
.success{color:#8ee29a}
.error{color:#ff9999}
</style>
</head>

<body>
<div class="container">

  <h1>MELODY MAGIC</h1>
  <p class="muted">DIGITAL AUDITORIUM</p>

  <div class="card">
    <h2>Selected Show</h2>
    <div id="showDetails" class="muted">
      Loading show details...
    </div>
  </div>

  <div class="card">
    <h2>Singer Registration</h2>

    <form id="registrationForm">

      <label>Full Name</label>
      <input id="singerName" type="text"
        placeholder="Enter your name" required>

      <label>Mobile Number</label>
      <input id="mobile" type="tel"
        placeholder="Enter mobile number"
        pattern="[0-9+ -]{8,15}" required>

      <label>Song Name</label>
      <input id="songName" type="text"
        placeholder="Which song will you sing?" required>

      <label>Language</label>
      <select id="language" required>
        <option value="Hindi">Hindi</option>
        <option value="Marathi">Marathi</option>
        <option value="English">English</option>
        <option value="Other">Other</option>
      </select>

      <label>Performance Type</label>
      <select id="performance" required>
        <option value="Solo">Solo</option>
        <option value="Duet">Duet</option>
        <option value="Group">Group</option>
      </select>

      <button id="submitButton" type="submit">
        SUBMIT REGISTRATION
      </button>

    </form>

    <div id="message" aria-live="polite"></div>
  </div>
</div>

<script type="module">

import { db, auth } from "./firebase.js";

import {
  ref, get, push, set
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

import {
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const showId =
  new URLSearchParams(window.location.search).get("showId");

const showDetails = document.getElementById("showDetails");
const message = document.getElementById("message");
const form = document.getElementById("registrationForm");
const submitButton = document.getElementById("submitButton");

let selectedShow = null;

function showMessage(text, type) {
  message.textContent = text;
  message.className = type;
}

async function loadShow() {
  try {
    if (!showId) {
      throw new Error("No show ID found. Please select a show from the homepage.");
    }

    const snapshot = await get(ref(db, "shows/" + showId));

    if (!snapshot.exists()) {
      throw new Error("This show does not exist in Firebase.");
    }

    selectedShow = snapshot.val();

    if (selectedShow.status !== "Published") {
      throw new Error("This show is not currently available.");
    }

    showDetails.textContent = "";

    const title = document.createElement("h3");
    title.textContent = selectedShow.title || "Singing Show";

    const date = document.createElement("p");
    date.textContent = "Date: " + (selectedShow.date || "To be announced");

    const time = document.createElement("p");
    time.textContent = "Time: " + (selectedShow.time || "To be announced");

    const host = document.createElement("p");
    host.textContent = "Host: " + (selectedShow.hostName || "Host");

    showDetails.append(title, date, time, host);

  } catch (error) {
    showDetails.textContent = error.message;
    showDetails.className = "error";
    form.style.display = "none";
    console.error("Show loading error:", error);
  }
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  if (!selectedShow) {
    showMessage("Show details are not available. Please refresh the page.", "error");
    return;
  }

  const name = document.getElementById("singerName").value.trim();
  const mobile = document.getElementById("mobile").value.trim();
  const song = document.getElementById("songName").value.trim();
  const language = document.getElementById("language").value;
  const performance = document.getElementById("performance").value;

  if (!name || !mobile || !song) {
    showMessage("Please complete all fields.", "error");
    return;
  }

  submitButton.disabled = true;
  submitButton.textContent = "PLEASE WAIT...";
  showMessage("Saving your registration...", "muted");

  try {
    let user = auth.currentUser;

    if (!user) {
      const result = await signInAnonymously(auth);
      user = result.user;
    }

    const registrationRef = push(
      ref(db, "registrations/" + user.uid)
    );

    await set(registrationRef, {
      singerUid: user.uid,
      name,
      mobile,
      song,
      language,
      performance,
      showId,
      showTitle: selectedShow.title || "",
      hostUid: selectedShow.hostUid || "",
      status: "Waiting",
      createdAt: Date.now()
    });

    showMessage(
      "Registration successful! Your registration ID: " +
      registrationRef.key,
      "success"
    );

    form.reset();

  } catch (error) {
    console.error("Firebase registration error:", error);
    showMessage(
      "Registration failed: " + error.message,
      "error"
    );

  } finally {
    submitButton.disabled = false;
    submitButton.textContent = "SUBMIT REGISTRATION";
  }
});

loadShow();

</script>
</body>
</html>
