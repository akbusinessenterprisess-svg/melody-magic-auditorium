
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join Melody Magic Digital Auditorium</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:20px;
  background:#090807;color:#fff;
  font-family:Arial,sans-serif;
}
.container{max-width:600px;margin:30px auto}
h1,h2{color:#e7bd68}
.card{
  background:#191510;border:1px solid #705322;
  border-radius:12px;padding:22px;margin-top:18px;
}
label{display:block;color:#e7bd68;margin-top:15px;font-size:14px}
input,select{
  width:100%;padding:13px;margin-top:7px;
  background:#0d0b08;color:white;
  border:1px solid #57452c;border-radius:6px;
  font-size:16px;
}
button{
  width:100%;padding:14px;margin-top:20px;
  background:#e7bd68;color:#171009;
  border:0;border-radius:7px;
  font-size:16px;font-weight:bold;cursor:pointer;
}
.muted{color:#c2b7a6;line-height:1.6}
#message{margin-top:18px;line-height:1.6}
.success{color:#8ee29a}
.error{color:#ff9999}
</style>
</head>

<body>
<div class="container">
  <h1>MELODY MAGIC</h1>
  <p class="muted">DIGITAL AUDITORIUM — SINGER REGISTRATION</p>

  <div class="card">
    <h2>Selected Singing Show</h2>
    <div id="showDetails" class="muted">Loading show details...</div>
  </div>

  <div class="card">
    <h2>Register as a Singer</h2>

    <form id="registrationForm">
      <label>Full Name</label>
      <input id="singerName" type="text"
        placeholder="Enter your full name" required>

      <label>Mobile Number</label>
      <input id="mobile" type="tel"
        placeholder="Enter your mobile number"
        pattern="[0-9+ -]{8,15}" required>

      <label>Song Name</label>
      <input id="songName" type="text"
        placeholder="Enter the song you want to sing" required>

      <label>Language</label>
      <select id="language" required>
        <option value="Hindi">Hindi</option>
        <option value="Marathi">Marathi</option>
        <option value="English">English</option>
        <option value="Other">Other</option>
      </select>

      <label>Performance Type</label>
      <select id="performance" required>
        <option value="Solo">Solo</option>
        <option value="Duet">Duet</option>
        <option value="Group">Group</option>
      </select>

      <button id="submitButton" type="submit">
        SUBMIT REGISTRATION
      </button>
    </form>

    <div id="message" aria-live="polite"></div>
  </div>
</div>

<script type="module">
import { db, auth } from "./firebase.js";

import {
  ref, get, push, set
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

import {
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const params = new URLSearchParams(window.location.search);
const showId = params.get("showId");

const showDetails = document.getElementById("showDetails");
const message = document.getElementById("message");
const form = document.getElementById("registrationForm");
const submitButton = document.getElementById("submitButton");

let selectedShow = null;

async function loadShow() {
  if (!showId) {
    showDetails.textContent = "No show selected. Please return to the homepage and choose a show.";
    form.style.display = "none";
    return;
  }

  try {
    const snapshot = await get(ref(db, "shows/" + showId));

    if (!snapshot.exists()) {
      showDetails.textContent = "This show could not be found.";
      form.style.display = "none";
      return;
    }

    selectedShow = snapshot.val();

    if (selectedShow.status !== "Published") {
      showDetails.textContent = "This show is not currently available.";
      form.style.display = "none";
      return;
    }

    showDetails.innerHTML = "";

    const title = document.createElement("h3");
    title.textContent = selectedShow.title || "Singing Show";

    const date = document.createElement("p");
    date.textContent = "Date: " + (selectedShow.date || "To be announced");

    const time = document.createElement("p");
    time.textContent = "Time: " + (selectedShow.time || "To be announced");

    const host = document.createElement("p");
    host.textContent = "Host: " + (selectedShow.hostName || "Melody Magic Host");

    showDetails.append(title, date, time, host);

  } catch (error) {
    showDetails.textContent = "Unable to load show details. Please refresh and try again.";
    console.error(error);
  }
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  if (!selectedShow) {
    message.textContent = "Please select a valid show first.";
    message.className = "error";
    return;
  }

  const name = document.getElementById("singerName").value.trim();
  const mobile = document.getElementById("mobile").value.trim();
  const song = document.getElementById("songName").value.trim();
  const language = document.getElementById("language").value;
  const performance = document.getElementById("performance").value;

  if (!name || !mobile || !song) {
    message.textContent = "Please complete all required fields.";
    message.className = "error";
    return;
  }

  submitButton.disabled = true;
  submitButton.textContent = "SUBMITTING...";
  message.textContent = "Please wait. Saving your registration...";
  message.className = "muted";

  try {
    let user = auth.currentUser;

    if (!user) {
      const result = await signInAnonymously(auth);
      user = result.user;
    }

    const registrationRef = push(ref(db, "registrations/" + user.uid));

    await set(registrationRef, {
      singerUid: user.uid,
      name: name,
      mobile: mobile,
      song: song,
      language: language,
      performance: performance,
      showId: showId,
      showTitle: selectedShow.title || "",
      hostUid: selectedShow.hostUid || "",
      status: "Waiting",
      createdAt: Date.now()
    });

    message.textContent =
      "Registration successful! Your registration ID is: " +
      registrationRef.key +
      ". Please wait for the host to confirm your performance.";

    message.className = "success";
    form.reset();

  } catch (error) {
    console.error("Registration error:", error);
    message.textContent =
      "Registration failed: " + error.message +
      ". Please contact the host if this continues.";
    message.className = "error";

  } finally {
    submitButton.disabled = false;
    submitButton.textContent = "SUBMIT REGISTRATION";
  }
});

loadShow();
</script>
</body>
</html>
