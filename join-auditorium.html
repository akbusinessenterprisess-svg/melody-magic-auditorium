
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register as Singer | Melody Magic</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#090807;color:white;
  font-family:Arial,sans-serif
}
header,footer{
  background:#15110c;text-align:center;
  padding:20px;border-bottom:1px solid #80612d
}
.logo{color:#e7bd68;font-size:23px;font-weight:bold}
.logo small{display:block;color:white;font-size:11px;letter-spacing:3px}
main{max-width:600px;margin:25px auto;padding:15px}
.card{
  background:#191510;border:1px solid #80612d;
  border-radius:12px;padding:22px
}
h2{color:#e7bd68;text-align:center}
p{text-align:center;color:#c8bda9;line-height:1.5}
label{display:block;color:#e7bd68;margin-top:15px;font-size:14px}
input,select{
  width:100%;padding:13px;margin-top:7px;
  border-radius:6px;border:1px solid #57452c;
  background:#090807;color:white;font-size:16px
}
button{
  width:100%;padding:15px;margin-top:22px;
  background:#e7bd68;color:#171009;
  border:0;border-radius:6px;font-weight:bold;
  font-size:15px;cursor:pointer
}
button:disabled{opacity:.5;cursor:not-allowed}
#message{text-align:center;margin-top:18px;font-weight:bold}
footer{margin-top:35px;border-top:1px solid #80612d}
footer strong{color:#e7bd68}
</style>
</head>
<body>

<header>
  <div class="logo">
    MELODY MAGIC
    <small>DIGITAL AUDITORIUM</small>
  </div>
</header>

<main>
  <div class="card">
    <h2>🎤 REGISTER AS A SINGER</h2>
    <p>Take your place on the Melody Magic stage.</p>

    <div id="showDetails">Loading show details...</div>

    <form id="registrationForm">
      <label>Full Name</label>
      <input id="singerName" required maxlength="80"
             placeholder="Enter your full name">

      <label>Mobile Number</label>
      <input id="mobile" type="tel" required
             maxlength="15" placeholder="Enter mobile number">

      <label>Song Name</label>
      <input id="songName" required maxlength="120"
             placeholder="Enter your song name">

      <label>Language</label>
      <select id="language" required>
        <option value="Hindi">Hindi</option>
        <option value="Marathi">Marathi</option>
        <option value="English">English</option>
        <option value="Other">Other</option>
      </select>

      <label>Performance</label>
      <select id="performance" required>
        <option value="Solo">Solo</option>
        <option value="Duet">Duet</option>
        <option value="Group">Group</option>
      </select>

      <button id="submitButton" type="submit">
        SUBMIT REGISTRATION
      </button>
    </form>

    <div id="message" role="status"></div>
  </div>
</main>

<footer>
  <strong>MELODY MAGIC MUSIC STUDIO</strong>
  <p>DIGITAL AUDITORIUM</p>
  <p>Sing Together. Shine Together.</p>
  <p>Created by Amol Kamble</p>
  <p>© 2026 Melody Magic</p>
</footer>

<script type="module">
import { db, registerSinger } from "./firebase.js";
import {
  ref,
  onValue
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const params = new URLSearchParams(window.location.search);
const showId = params.get("showId");

const details = document.getElementById("showDetails");
const form = document.getElementById("registrationForm");
const message = document.getElementById("message");
const button = document.getElementById("submitButton");

let currentShow = null;

function showMessage(text, success = false) {
  message.textContent = text;
  message.style.color = success ? "#a8dfa5" : "#ff9999";
}

if (!showId) {
  details.textContent = "No show selected. Please return to the sessions page.";
  button.disabled = true;
} else {
  onValue(ref(db, "shows/" + showId), snapshot => {
    if (!snapshot.exists()) {
      currentShow = null;
      details.textContent = "Show not found.";
      button.disabled = true;
      return;
    }

    currentShow = snapshot.val();

    if (currentShow.status !== "Published") {
      details.textContent = "This show is not open for registration.";
      button.disabled = true;
      return;
    }

    details.innerHTML = `
      <h3 style="color:#e7bd68;text-align:center"></h3>
      <p id="showInfo"></p>
    `;

    details.querySelector("h3").textContent =
      currentShow.title || "Singing Session";

    details.querySelector("#showInfo").textContent =
      (currentShow.hostName || "Melody Magic Host") +
      " | " + (currentShow.date || "Date to be announced") +
      " | " + (currentShow.time || "Time to be announced") +
      " | Entry: " +
      (currentShow.entryType === "paid"
        ? "₹" + (currentShow.entryFee || 0)
        : "Free");

    button.disabled = false;
  }, error => {
    details.textContent = "Unable to load show details.";
    showMessage(error.message);
    button.disabled = true;
  });
}

form.addEventListener("submit", async event => {
  event.preventDefault();

  if (!currentShow || !showId) {
    showMessage("Please select a valid published show.");
    return;
  }

  const name = document.getElementById("singerName").value.trim();
  const mobile = document.getElementById("mobile").value.trim();
  const song = document.getElementById("songName").value.trim();
  const language = document.getElementById("language").value;
  const performance = document.getElementById("performance").value;

  if (!/^[0-9+\-\s]{8,15}$/.test(mobile)) {
    showMessage("Please enter a valid mobile number.");
    return;
  }

  button.disabled = true;
  button.textContent = "SAVING REGISTRATION...";

  try {
    const registrationId = await registerSinger(
      name, mobile, song, language, showId, performance
    );

    form.reset();
    showMessage(
      "Registration saved successfully! Reference: " + registrationId,
      true
    );
  } catch (error) {
    console.error(error);
    showMessage("Registration failed: " + error.message);
  } finally {
    button.disabled = false;
    button.textContent = "SUBMIT REGISTRATION";
  }
});
</script>

</body>
</html>
