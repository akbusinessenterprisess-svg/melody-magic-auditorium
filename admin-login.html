
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login | Melody Magic</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:20px;background:#090909;
  color:#f5f0df;font-family:Arial,sans-serif
}
.login-box{
  width:100%;max-width:420px;background:#171717;
  border:1px solid #a8863b;border-radius:15px;padding:28px
}
h1{text-align:center;color:#e5bd60;font-size:25px}
h2{text-align:center;color:#e5bd60}
p{color:#c8c3b6;line-height:1.5;text-align:center}
label{display:block;margin-top:18px;color:#e5bd60;font-size:14px}
input{
  width:100%;padding:14px;margin-top:7px;
  background:#090909;color:white;border:1px solid #66532c;
  border-radius:7px;font-size:15px
}
button{
  width:100%;padding:14px;margin-top:22px;
  background:#d5ad50;color:#17120a;border:0;
  border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer
}
button:disabled{opacity:.5;cursor:not-allowed}
#message{margin-top:16px;font-size:14px;overflow-wrap:anywhere}
.error{color:#ff9999}
.success{color:#8ee29a}
a{color:#e5bd60}
</style>
</head>
<body>

<div class="login-box">
  <h1>MELODY MAGIC</h1>
  <h2>Administrator Login</h2>
  <p>Sign in using your existing administrator account.</p>

  <form id="loginForm">
    <label for="email">Admin Email</label>
    <input type="email" id="email" autocomplete="username" required>

    <label for="password">Admin Password</label>
    <input type="password" id="password"
           autocomplete="current-password" required>

    <button type="submit" id="loginButton">ADMIN SIGN IN</button>
  </form>

  <p id="message" role="status"></p>
</div>

<script type="module">
import { auth } from "./firebase.js";
import {
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const ADMIN_UID = "PI8sswS9a3ZBU001D3SBejMBJyO2";

const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");

function showMessage(text,type="error"){
  message.textContent=text;
  message.className=type;
}

onAuthStateChanged(auth,async(user)=>{
  if(user){
    if(user.uid === ADMIN_UID){
      window.location.replace("admin-dashboard.html");
    }else{
      await signOut(auth);
      showMessage("Access denied. This is not the administrator account.");
    }
  }
});

form.addEventListener("submit",async(event)=>{
  event.preventDefault();

  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  button.disabled=true;
  button.textContent="SIGNING IN...";
  showMessage("Verifying administrator account...");

  try{
    const credential=await signInWithEmailAndPassword(
      auth,email,password
    );

    if(credential.user.uid !== ADMIN_UID){
      await signOut(auth);
      throw new Error("Access denied. This account is not the administrator.");
    }

    showMessage("Admin verified. Opening dashboard...","success");
    window.location.replace("admin-dashboard.html");

  }catch(error){
    console.error(error);
    showMessage(error.message || "Login failed. Check your credentials.");
    button.disabled=false;
    button.textContent="ADMIN SIGN IN";
  }
});
</script>

</body>
</html>
