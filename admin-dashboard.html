
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard | Melody Magic</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#f5f0df;font-family:Arial,sans-serif}
header{padding:22px;text-align:center;background:#17130b;border-bottom:1px solid #b89542}
.brand{color:#e5bd60;font-size:23px;font-weight:bold}
main{max-width:1000px;margin:auto;padding:20px}
h2,h3{color:#e5bd60}
.notice,.application{background:#171717;border:1px solid #80652d;padding:16px;border-radius:10px;margin:15px 0}
.notice{background:#211b0e;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:20px 0}
.card{background:#171717;border:1px solid #51401f;border-radius:10px;padding:18px}
.number{font-size:27px;color:#e5bd60;font-weight:bold}
.application p{overflow-wrap:anywhere;line-height:1.5;font-size:14px}
button{border:0;border-radius:7px;padding:11px 16px;margin:5px 5px 5px 0;font-weight:bold;cursor:pointer}
.approve{background:#d5ad50;color:#17120a}
.reject{background:#8d2929;color:white}
button:disabled{opacity:.5;cursor:not-allowed}
input[type=checkbox]{accent-color:#d5ad50}
.status{color:#e5bd60;font-weight:bold}
.empty{color:#aaa;padding:20px;text-align:center}
#message{line-height:1.5;overflow-wrap:anywhere}
footer{text-align:center;color:#928b7b;padding:25px;font-size:12px}
</style>
</head>
<body>

<header>
  <div class="brand">MELODY MAGIC</div>
  <h2>Administrator Dashboard</h2>
  <p>HOST APPLICATION CONTROL</p>
</header>

<main>
  <div id="message" class="notice">Checking administrator access...</div>

  <section id="dashboard" hidden>
    <h2>Host Overview</h2>
    <div class="grid">
      <div class="card"><h3>Pending</h3><div class="number" id="pendingCount">0</div></div>
      <div class="card"><h3>Approved</h3><div class="number" id="approvedCount">0</div></div>
      <div class="card"><h3>Rejected</h3><div class="number" id="rejectedCount">0</div></div>
      <div class="card"><h3>Expired</h3><div class="number" id="expiredCount">0</div></div>
    </div>

    <h2>Host Applications</h2>
    <div id="applications">
      <p class="empty">Loading applications...</p>
    </div>

    <button id="logoutButton" class="reject">Sign Out</button>
  </section>
</main>

<footer>
  Melody Magic Digital Auditorium · Platform Administration
</footer>

<script type="module">
import { db, auth } from "./firebase.js";
import { ref, onValue, set } from
  "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
import { onAuthStateChanged, signOut } from
  "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const ADMIN_UID = "PI8sswS9a3ZBU001D3SBejMBJyO2";

const message = document.getElementById("message");
const dashboard = document.getElementById("dashboard");
const applications = document.getElementById("applications");

let stopListening = null;

const planDays = { daily: 1, weekly: 7, monthly: 30, Daily: 1, Weekly: 7, Monthly: 30 };
function showMessage(text, error = false) {
  message.textContent = text;
  message.style.color = error ? "#ff9999" : "#e5bd60";
}

function dateText(timestamp) {
  if (!timestamp) return "Not available";
  return new Date(timestamp).toLocaleString("en-IN");
}

function renderApplications(data) {
  const records = Object.entries(data || {});
  let pending = 0, approved = 0, rejected = 0, expired = 0;

  records.forEach(([uid, app]) => {
    if (app.status === "Pending") pending++;
    if (app.status === "Approved") approved++;
    if (app.status === "Rejected") rejected++;
    if (app.status === "Approved" &&
        app.subscriptionEndAt &&
        app.subscriptionEndAt < Date.now()) expired++;
  });

  document.getElementById("pendingCount").textContent = pending;
  document.getElementById("approvedCount").textContent = approved;
  document.getElementById("rejectedCount").textContent = rejected;
  document.getElementById("expiredCount").textContent = expired;

  applications.replaceChildren();

  if (!records.length) {
    applications.innerHTML = '<p class="empty">No host applications found.</p>';
    return;
  }

  records.forEach(([uid, app]) => {
    const card = document.createElement("div");
    card.className = "application";

    const heading = document.createElement("h3");
    heading.textContent = app.name || "Unnamed host";

    const details = document.createElement("p");
    details.textContent =
      "Email: " + (app.email || "—") +
      "\nMobile: " + (app.mobile || "—") +
      "\nPlan: " + (app.plan || "—") +
      "\nStatus: " + (app.status || "Unknown") +
      "\nApplied: " + dateText(app.createdAt);

    const status = document.createElement("p");
    status.className = "status";
    status.textContent = "Payment must be independently verified before approval.";

    card.append(heading, details);

    if (app.status === "Pending") {
      const label = document.createElement("label");
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      label.append(checkbox, document.createTextNode(
        " I have independently verified the subscription payment."
      ));

      const approveButton = document.createElement("button");
      approveButton.className = "approve";
      approveButton.textContent = "Approve & Activate";
      approveButton.disabled = true;

      checkbox.addEventListener("change", () => {
        approveButton.disabled = !checkbox.checked;
      });

      approveButton.addEventListener("click", async () => {
        const days = planDays[app.plan];
        if (!days || !checkbox.checked) {
          showMessage("Verify payment and check a valid subscription plan.", true);
          return;
        }

        approveButton.disabled = true;
        try {
          const now = Date.now();
          await set(ref(db, "hostApplications/" + uid), {
            ...app,
            status: "Approved",
            paymentStatus: "Verified by administrator",
            approvedAt: now,
            subscriptionStartAt: now,
            subscriptionEndAt: now + days * 24 * 60 * 60 * 1000
          });
          showMessage("Host approved and subscription activated.");
        } catch (error) {
          showMessage("Approval failed: " + error.message, true);
          approveButton.disabled = false;
        }
      });

      const rejectButton = document.createElement("button");
      rejectButton.className = "reject";
      rejectButton.textContent = "Reject";
      rejectButton.addEventListener("click", async () => {
        if (!confirm("Reject this host application?")) return;
        rejectButton.disabled = true;
        try {
          await set(ref(db, "hostApplications/" + uid), {
            ...app,
            status: "Rejected",
            rejectedAt: Date.now()
          });
          showMessage("Application rejected.");
        } catch (error) {
          showMessage("Rejection failed: " + error.message, true);
          rejectButton.disabled = false;
        }
      });

      card.append(status, label, document.createElement("br"),
                   approveButton, rejectButton);
    } else {
      const result = document.createElement("p");
      result.textContent =
        app.status === "Approved"
          ? "Subscription expires: " + dateText(app.subscriptionEndAt)
          : "Application status: " + (app.status || "Unknown");
      card.append(result);
    }

    applications.append(card);
  });
}

onAuthStateChanged(auth, (user) => {
  if (stopListening) {
    stopListening();
    stopListening = null;
  }

  if (!user) {
    dashboard.hidden = true;
    showMessage("Please sign in with the administrator account first.", true);
    return;
  }

  if (user.uid !== ADMIN_UID) {
    dashboard.hidden = true;
    showMessage("Access denied. This account is not an administrator.", true);
    return;
  }

  dashboard.hidden = false;
  showMessage("Administrator verified. Connected to Firebase.");

  stopListening = onValue(
    ref(db, "hostApplications"),
    (snapshot) => renderApplications(snapshot.val() || {}),
    (error) => showMessage("Could not load applications: " + error.message, true)
  );
});

document.getElementById("logoutButton").addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "host-login.html";
});
</script>

</body>
</html>
