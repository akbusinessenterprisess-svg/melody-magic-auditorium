
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Host Login | Melody Magic Digital Auditorium</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #090909;
  color: #f5f0df;
  font-family: Arial, sans-serif;
}

.login {
  width: 100%;
  max-width: 400px;
  padding: 28px;
  background: #171717;
  border: 1px solid #a8863b;
  border-radius: 16px;
  text-align: center;
  box-shadow: 0 10px 35px rgba(0,0,0,.4);
}

.brand {
  color: #e5bd60;
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 1px;
}

h2 { color: #e5bd60; }

p {
  color: #c8c3b6;
  line-height: 1.5;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 14px;
  margin: 9px 0;
  border: 1px solid #66532c;
  border-radius: 8px;
  background: #090909;
  color: white;
  font-size: 16px;
}

input:focus { outline: 1px solid #e5bd60; }

button {
  width: 100%;
  padding: 14px;
  margin-top: 14px;
  border: 0;
  border-radius: 8px;
  background: #d5ad50;
  color: #17120a;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

#message {
  margin-top: 18px;
  overflow-wrap: anywhere;
}

a {
  color: #e5bd60;
  text-decoration: none;
}

a:hover { text-decoration: underline; }

.signup {
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid #514326;
}

.signup a {
  font-weight: bold;
  font-size: 15px;
}
</style>
</head>

<body>

<div class="login">
  <div class="brand">MELODY MAGIC</div>
  <h2>Host Login</h2>

  <p>Sign in with your registered email and password.</p>

  <form id="loginForm">
    <input
      type="email"
      id="email"
      placeholder="Email address"
      autocomplete="username"
      required
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
      required
    >

    <button type="submit" id="loginButton">Sign In</button>
  </form>

  <p id="message" role="status" aria-live="polite"></p>

  <div class="signup">
    <p>Not registered as a host yet?</p>
    <a href="host-signup.html">✨ SIGN UP FOR HOST</a>
  </div>

  <p><a href="index.html">Back to Home</a></p>
</div>

<script type="module">

import {
  db,
  hostLogin
} from "./firebase-host.js";

import {
  ref,
  get
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginButton");

function showMessage(text, color = "#ff9999") {
  message.textContent = text;
  message.style.color = color;
}

function readHostApplication(applicationRef) {
  return Promise.race([
    get(applicationRef),
    new Promise((_, reject) => {
      setTimeout(() => {
        reject(new Error("Database read timed out after 12 seconds"));
      }, 12000);
    })
  ]);
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    showMessage("Please enter your email and password.");
    return;
  }

  button.disabled = true;
  button.textContent = "Signing in...";
  showMessage("Signing in...", "#e5bd60");

  try {
    // Step 1: Authenticate host
    const user = await hostLogin(email, password);

    showMessage("Login successful. Checking host account...", "#e5bd60");

    // Step 2: Read host application
    const applicationRef = ref(
      db,
      "hostApplications/" + user.uid
    );

    const snapshot = await readHostApplication(applicationRef);

    console.log("Host application found:", snapshot.exists());
    console.log("Host application data:", snapshot.val());

    if (!snapshot.exists()) {
      showMessage(
        "Host application not found. Please contact the administrator."
      );
      return;
    }

    const application = snapshot.val();

    // Step 3: Approval check
    if (application.status !== "Approved") {
      showMessage(
        "Your host application is not approved yet."
      );
      return;
    }

    // Step 4: Subscription check
    const start = Number(application.subscriptionStartAt);
    const end = Number(application.subscriptionEndAt);
    const now = Date.now();

    if (
      !Number.isFinite(start) ||
      !Number.isFinite(end) ||
      start <= 0 ||
      end <= 0 ||
      now < start ||
      now >= end
    ) {
      showMessage(
        "Your subscription is not active or has expired. Please contact the administrator."
      );
      return;
    }

    // Step 5: Open dashboard
    showMessage(
      "Login successful! Opening your dashboard...",
      "#9be7a5"
    );

    window.location.replace("host-dashboard.html");

  } catch (error) {
    console.error("Host login error:", error);

    let errorMessage = error.message || "Unknown error";

    switch (error.code) {
      case "auth/invalid-credential":
        errorMessage = "Incorrect email or password.";
        break;

      case "auth/user-not-found":
        errorMessage = "No account found with this email.";
        break;

      case "auth/too-many-requests":
        errorMessage = "Too many attempts. Please try again later.";
        break;

      case "PERMISSION_DENIED":
        errorMessage = "Firebase database permission denied.";
        break;

      case "NETWORK_ERROR":
        errorMessage = "Network error. Check your internet connection.";
        break;
    }

    showMessage("Login failed: " + errorMessage);

  } finally {
    button.disabled = false;
    button.textContent = "Sign In";
  }
});

</script>

</body>
</html>
