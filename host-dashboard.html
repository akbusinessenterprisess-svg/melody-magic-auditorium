
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melody Magic - Host Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d18;color:#fff;font-family:Arial,sans-serif}
header{background:#151d32;padding:20px;text-align:center;border-bottom:2px solid #e5ad35}
h1{color:#f5bd43;margin:0}
.container{max-width:1000px;margin:25px auto;padding:15px}
.card{background:#151d32;padding:20px;border-radius:12px;margin-bottom:20px}
h2{color:#f5bd43;margin-top:0}
input,textarea,select{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #39445e;border-radius:7px;background:#0c1426;color:white}
button{padding:12px 18px;border:0;border-radius:7px;background:#e5ad35;color:#111;font-weight:bold;cursor:pointer;margin:5px 3px}
button:disabled{opacity:.5;cursor:not-allowed}
button.secondary{background:#35415d;color:white}
button.danger{background:#b83232;color:white}
.small{color:#b9c4d8;font-size:13px}
.status{padding:12px;background:#26344d;border-radius:7px;margin:10px 0;white-space:pre-wrap}
.show{border:1px solid #39445e;padding:15px;border-radius:9px;margin:12px 0}
a{color:#f5bd43;overflow-wrap:anywhere}
.hidden{display:none}
label{display:block;color:#dbe2ef}
</style>
</head>
<body>

<header>
<h1>MELODY MAGIC</h1>
<div>DIGITAL AUDITORIUM — HOST DASHBOARD</div>
</header>

<div class="container">

<div id="message" class="status">Checking host account...</div>

<div id="dashboard" class="hidden">

<div class="card">
<h2>Host Account</h2>
<div id="hostInfo">Loading...</div>
<button class="danger" id="logoutBtn">Logout</button>
</div>

<div class="card">
<h2>Create Your Show</h2>

<label>Show Name</label>
<input id="showName" placeholder="Enter show name" required>

<label>Show Description</label>
<textarea id="showDescription" rows="3" placeholder="Describe your show"></textarea>

<label>Show Date</label>
<input id="showDate" type="date" required>

<label>Show Time</label>
<input id="showTime" type="time" required>

<label>Performer Entry Fee (₹)</label>
<input id="performerFee" type="number" min="0" value="0">

<label>Audience Entry Fee (₹)</label>
<input id="audienceFee" type="number" min="0" value="0">

<label>Show Type</label>
<select id="showType">
<option value="Karaoke">Karaoke</option>
<option value="Live Singing">Live Singing</option>
<option value="Music Show">Music Show</option>
<option value="Open Mic">Open Mic</option>
<option value="Other">Other</option>
</select>

<button id="createShowBtn">Create Show</button>
<div id="createMessage" class="small"></div>
</div>

<div class="card">
<h2>My Shows</h2>
<div id="showsList">Loading your shows...</div>
</div>

</div>
</div>

<script type="module">
import { auth, db } from "./firebase-host.js";

import {
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
  ref,
  get,
  push,
  set
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const message = document.getElementById("message");
const dashboard = document.getElementById("dashboard");
const hostInfo = document.getElementById("hostInfo");
const showsList = document.getElementById("showsList");
const createMessage = document.getElementById("createMessage");

let currentUser = null;
let currentHost = null;

function showMessage(text) {
  message.textContent = text;
  message.classList.remove("hidden");
}

function hideMessage() {
  message.classList.add("hidden");
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function withTimeout(promise, milliseconds = 12000) {
  return Promise.race([
    promise,
    new Promise((_, reject) =>
      setTimeout(() => reject(new Error(
        "Request timed out. Check your Firebase connection and database rules."
      )), milliseconds)
    )
  ]);
}

onAuthStateChanged(auth, async user => {
  if (!user) {
    showMessage("Please log in with your host account. Redirecting...");
    setTimeout(() => location.href = "host-login.html", 1500);
    return;
  }

  currentUser = user;
  showMessage("Checking host account...");

  try {
    const snapshot = await withTimeout(
      get(ref(db, "hostApplications/" + user.uid))
    );

    if (!snapshot.exists()) {
      showMessage("Host application not found. Please contact the administrator.");
      return;
    }

    currentHost = snapshot.val();

    if (currentHost.status !== "Approved") {
      showMessage("Your host account is not approved yet.");
      return;
    }

    const start = Number(currentHost.subscriptionStartAt || 0);
    const end = Number(currentHost.subscriptionEndAt || 0);
    const now = Date.now();

    if (!start || !end || now < start || now >= end) {
      showMessage("Your host subscription is not currently active. Please contact the administrator.");
      return;
    }

    hostInfo.innerHTML =
      "<strong>" + escapeHTML(currentHost.name || user.email) +
      "</strong><br>" + escapeHTML(user.email) +
      "<br>Subscription: Active";

    dashboard.classList.remove("hidden");
    hideMessage();
    await loadShows();

  } catch (error) {
    console.error(error);
    showMessage("Unable to verify host account: " + error.message);
  }
});

async function loadShows() {
  showsList.textContent = "Loading your shows...";

  try {
    const snapshot = await withTimeout(get(ref(db, "shows")));
    showsList.innerHTML = "";

    if (!snapshot.exists()) {
      showsList.textContent = "You have not created any shows yet.";
      return;
    }

    const shows = snapshot.val();
    let found = false;

    for (const [id, show] of Object.entries(shows)) {

      // IMPORTANT: Firebase rules use hostUid.
      if (show.hostUid !== currentUser.uid) continue;

      found = true;

      const entry = document.createElement("div");
      entry.className = "show";

      const audienceLink = new URL(
        "audience-entry.html?showId=" + encodeURIComponent(id),
        location.href
      ).href;

      entry.innerHTML = `
        <h3>${escapeHTML(show.name)}</h3>
        <p>${escapeHTML(show.description || "")}</p>
        <p>Date: ${escapeHTML(show.date || "Not set")} |
        Time: ${escapeHTML(show.time || "Not set")}</p>
        <p>Type: ${escapeHTML(show.type || "")}</p>
        <p>Performer fee: ₹${escapeHTML(show.performerFee ?? 0)}</p>
        <p>Audience fee: ₹${escapeHTML(show.audienceFee ?? 0)}</p>
        <p>Status: ${escapeHTML(show.status || "Published")}</p>
        <p><strong>Audience registration link:</strong><br>
        <a href="${audienceLink}" target="_blank" rel="noopener">${audienceLink}</a></p>
        <button class="copyBtn">Copy Audience Link</button>
        <button class="posterBtn secondary">Create Poster</button>
      `;

      entry.querySelector(".copyBtn").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(audienceLink);
          alert("Audience link copied.");
        } catch {
          prompt("Copy this audience link:", audienceLink);
        }
      });

      entry.querySelector(".posterBtn").addEventListener("click", () => {
        createPoster(show, audienceLink);
      });

      showsList.appendChild(entry);
    }

    if (!found) {
      showsList.textContent = "You have not created any shows yet.";
    }

  } catch (error) {
    console.error(error);
    showsList.textContent = "Could not load shows: " + error.message;
  }
}

document.getElementById("createShowBtn").addEventListener("click", async () => {
  const name = document.getElementById("showName").value.trim();
  const description = document.getElementById("showDescription").value.trim();
  const date = document.getElementById("showDate").value;
  const time = document.getElementById("showTime").value;
  const performerFee = Number(document.getElementById("performerFee").value || 0);
  const audienceFee = Number(document.getElementById("audienceFee").value || 0);
  const type = document.getElementById("showType").value;

  if (!currentUser || !currentHost) {
    alert("Your host account is not ready. Please refresh and log in again.");
    return;
  }

  if (!name || !date || !time) {
    alert("Please enter show name, date and time.");
    return;
  }

  if (performerFee < 0 || audienceFee < 0 ||
      !Number.isFinite(performerFee) || !Number.isFinite(audienceFee)) {
    alert("Please enter valid, non-negative fees.");
    return;
  }

  const button = document.getElementById("createShowBtn");
  button.disabled = true;
  button.textContent = "Creating...";
  createMessage.textContent = "";

  try {
    const newShow = push(ref(db, "shows"));

    await withTimeout(set(newShow, {
      // IMPORTANT: This field must match your Firebase security rule.
      hostUid: currentUser.uid,
      hostName: currentHost.name || currentUser.email,
      name,
      description,
      date,
      time,
      performerFee,
      audienceFee,
      type,
      status: "Published",
      createdAt: Date.now()
    }));

    alert("Your show has been created.");

    document.getElementById("showName").value = "";
    document.getElementById("showDescription").value = "";
    document.getElementById("showDate").value = "";
    document.getElementById("showTime").value = "";

    await loadShows();

  } catch (error) {
    console.error("Show creation error:", error);
    createMessage.textContent = "Error: " + error.message;
    alert("Could not create show: " + error.message);
  } finally {
    button.disabled = false;
    button.textContent = "Create Show";
  }
});

function createPoster(show, link) {
  const canvas = document.createElement("canvas");
  canvas.width = 1080;
  canvas.height = 1350;

  const ctx = canvas.getContext("2d");
  const gradient = ctx.createLinearGradient(0, 0, 1080, 1350);
  gradient.addColorStop(0, "#111a35");
  gradient.addColorStop(1, "#401b45");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 1080, 1350);

  ctx.textAlign = "center";
  ctx.fillStyle = "#f5bd43";
  ctx.font = "bold 58px Arial";
  ctx.fillText("MELODY MAGIC", 540, 140);

  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 42px Arial";
  ctx.fillText("DIGITAL AUDITORIUM", 540, 205);

  ctx.fillStyle = "#f5bd43";
  ctx.font = "bold 64px Arial";
  wrapText(ctx, show.name || "Music Show", 540, 430, 850, 85);

  ctx.fillStyle = "#ffffff";
  ctx.font = "38px Arial";
  ctx.fillText(show.date || "", 540, 680);
  ctx.fillText(show.time || "", 540, 750);

  ctx.font = "30px Arial";
  ctx.fillText("Performer Entry: ₹" + (show.performerFee || 0), 540, 850);
  ctx.fillText("Audience Entry: ₹" + (show.audienceFee || 0), 540, 915);

  ctx.fillStyle = "#f5bd43";
  ctx.font = "bold 34px Arial";
  ctx.fillText("JOIN THE SHOW", 540, 1080);

  ctx.fillStyle = "#ffffff";
  ctx.font = "22px Arial";
  ctx.fillText("Register using the audience link shared by your host", 540, 1140);

  ctx.font = "18px Arial";
  ctx.fillText("Melody Magic Music Studio", 540, 1270);

  canvas.toBlob(blob => {
    if (!blob) {
      alert("Could not create poster.");
      return;
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "Melody-Magic-Show-Poster.png";
    a.click();
    URL.revokeObjectURL(url);
  }, "image/png");
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = String(text).split(" ");
  let line = "";
  let currentY = y;

  for (const word of words) {
    const test = line ? line + " " + word : word;

    if (ctx.measureText(test).width > maxWidth && line) {
      ctx.fillText(line, x, currentY);
      line = word;
      currentY += lineHeight;
    } else {
      line = test;
    }
  }

  if (line) ctx.fillText(line, x, currentY);
}

document.getElementById("logoutBtn").addEventListener("click", async () => {
  try {
    await signOut(auth);
    location.href = "host-login.html";
  } catch (error) {
    alert("Logout failed: " + error.message);
  }
});
</script>

<footer style="text-align:center;padding:25px;color:#aab4c8">
Melody Magic Digital Auditorium<br>
Powered by Melody Magic Music Studio
</footer>

</body>
</html>
