<body>

<header>
<h1>MELODY MAGIC</h1>
<div>DIGITAL AUDITORIUM — HOST DASHBOARD</div>

<div class="container">

<div id="message" class="status">Checking host account...</div>

<div class="card">
<h2>Host Account</h2>
<div id="hostInfo">Loading...</div>

<div class="card">

<label>Show Name</label>

12-hour AM/PM display will be used. All show timings are in IST (UTC+5:30).

</div>

</div>

<footer>
Melody Magic Digital Auditorium<br>
Powered by Melody Magic Music Studio
</footer>

<script type="module">
import { auth, db } from "./firebase-host.js";

import {
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
  ref,
  get,
  push,
  set,
  update
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const CLOUD_NAME = "quqojlew";
const UPLOAD_PRESET = "melody_magic_posters";
const MAX_FILE_SIZE = 5 * 1024 * 1024;

const message = document.getElementById("message");
const dashboard = document.getElementById("dashboard");
const hostInfo = document.getElementById("hostInfo");
const showsList = document.getElementById("showsList");
const createMessage = document.getElementById("createMessage");

let currentUser = null;
let currentHost = null;

function showMessage(text) {
  message.textContent = text;
  message.classList.remove("hidden");
}

function hideMessage() {
  message.classList.add("hidden");
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function withTimeout(promise, milliseconds = 20000) {
  return Promise.race([
    promise,
    new Promise((_, reject) =>
      setTimeout(() => reject(new Error(
        "Request timed out. Check your internet connection and Firebase rules."
      )), milliseconds)
    )
  ]);
}

function validCloudinaryURL(url) {
  try {
    const parsed = new URL(url);
    return parsed.protocol === "https:" &&
      parsed.hostname === "res.cloudinary.com";
  } catch {
    return false;
  }
}

/* Format stored HH:mm time without applying a timezone conversion.
   The entered time is already the intended India local wall-clock time. */
function formatTime12Hour(timeValue) {
  if (!timeValue || !/^\d{2}:\d{2}$/.test(timeValue)) {
    return "Time not set";
  }

  const [hourText, minuteText] = timeValue.split(":");
  let hour = Number(hourText);
  const minute = minuteText;

  if (hour > 23 || Number(minute) > 59) return "Invalid time";

  const suffix = hour >= 12 ? "PM" : "AM";
  hour = hour % 12 || 12;

  return String(hour).padStart(2, "0") + ":" + minute + " " + suffix;
}

function formatDate(dateValue) {
  if (!dateValue) return "Date not set";

  const parts = dateValue.split("-");
  if (parts.length !== 3) return dateValue;

  return parts[2] + "/" + parts[1] + "/" + parts[0];
}

function showPosterStatus(status) {
  const value = String(status || "").toLowerCase();

  if (value === "approved") {
    return '<span class="badge approved">Approved</span>';
  }

  if (value === "rejected") {
    return '<span class="badge rejected">Rejected</span>';
  }

  if (value === "pending") {
    return '<span class="badge pending">Pending admin approval</span>';
  }

  return '<span class="badge">No custom poster submitted</span>';
}

onAuthStateChanged(auth, async user => {
  if (!user) {
    showMessage("Please log in with your host account. Redirecting...");
    setTimeout(() => location.href = "host-login.html", 1500);
    return;
  }

  currentUser = user;
  showMessage("Checking host account...");

  try {
    const snapshot = await withTimeout(
      get(ref(db, "hostApplications/" + user.uid))
    );

    if (!snapshot.exists()) {
      showMessage("Host application not found. Please contact the administrator.");
      return;
    }

    currentHost = snapshot.val();

    if (currentHost.status !== "Approved") {
      showMessage("Your host account is not approved yet.");
      return;
    }

    const start = Number(currentHost.subscriptionStartAt || 0);
    const end = Number(currentHost.subscriptionEndAt || 0);
    const now = Date.now();

    if (!start || !end || now < start || now >= end) {
      showMessage("Your host subscription is not currently active. Please contact the administrator.");
      return;
    }

    hostInfo.innerHTML =
      "<strong>" + escapeHTML(currentHost.name || user.email) +
      "</strong><br>" + escapeHTML(user.email) +
      "<br>Subscription: Active";

    dashboard.classList.remove("hidden");
    hideMessage();

    await loadShows();

  } catch (error) {
    console.error(error);
    showMessage("Unable to verify host account: " + error.message);
  }
});

async function loadShows() {
  showsList.textContent = "Loading your shows...";

  try {
    const snapshot = await withTimeout(get(ref(db, "shows")));

    if (!snapshot.exists()) {
      showsList.textContent = "You have not created any shows yet.";
      return;
    }

    const shows = snapshot.val();
    const myShows = Object.entries(shows)
      .filter(([id, show]) => show && show.hostUid === currentUser.uid);

    showsList.innerHTML = "";

    if (!myShows.length) {
      showsList.textContent = "You have not created any shows yet.";
      return;
    }

    for (const [id, show] of myShows) {
      const entry = document.createElement("div");
      entry.className = "show";

      const audienceLink = new URL(
        "audience-entry.html?showId=" + encodeURIComponent(id),
        location.href
      ).href;

      const performerLink = new URL(
        "join-auditorium.html?showId=" + encodeURIComponent(id),
        location.href
      ).href;

      let posterRecord = null;

      try {
        const posterSnapshot = await withTimeout(
          get(ref(db, "showPosters/" + id))
        );

        if (posterSnapshot.exists()) {
          posterRecord = posterSnapshot.val();
        }
      } catch (posterError) {
        console.warn("Could not read poster status:", posterError);
      }

      const customPosterURL =
        posterRecord && validCloudinaryURL(posterRecord.imageUrl)
          ? posterRecord.imageUrl
          : "";

      const posterStatus = posterRecord
        ? posterRecord.status
        : "";

      const posterUploadAllowed =
        !posterRecord || posterStatus === "Rejected";

      entry.innerHTML = `
        <h3>${escapeHTML(show.name || "Untitled Show")}</h3>

        <p>${escapeHTML(show.description || "")}</p>

        <p>
          <strong>Date:</strong> ${escapeHTML(formatDate(show.date))}<br>
          <strong>Time:</strong> ${escapeHTML(formatTime12Hour(show.time))}
          <br><span class="small">India Standard Time (IST, UTC+5:30)</span>
        </p>

        <p>Type: ${escapeHTML(show.type || "")}</p>
        <p>Performer fee: ₹${escapeHTML(show.performerFee ?? 0)}</p>
        <p>Audience fee: ₹${escapeHTML(show.audienceFee ?? 0)}</p>
        <p>Status: ${escapeHTML(show.status || "Published")}</p>

        <div class="button-row">
          <button class="performerBtn">Performer – Join Show</button>
          <button class="audienceBtn">Audience – Join Show</button>
          <button class="detailsBtn secondary">Show Details</button>
        </div>

        <div class="show-details hidden">
          <h4>Show Information</h4>
          <p><strong>Show ID:</strong> ${escapeHTML(id)}</p>
          <p><strong>Show name:</strong> ${escapeHTML(show.name || "")}</p>
          <p><strong>Date:</strong> ${escapeHTML(formatDate(show.date))}</p>
          <p><strong>Time:</strong> ${escapeHTML(formatTime12Hour(show.time))} IST</p>
          <p><strong>Performer entry:</strong> ₹${escapeHTML(show.performerFee ?? 0)}</p>
          <p><strong>Audience entry:</strong> ₹${escapeHTML(show.audienceFee ?? 0)}</p>
        </div>

        <hr style="border-color:#39445e;margin:18px 0">

        <h4>Promotional Show Poster</h4>
        <p class="small">
          Generate a poster with your show information and a QR code
          that visitors can scan to open the audience registration page.
        </p>

        <button class="posterBtn secondary">Generate Promotional Poster</button>
        <button class="sharePosterBtn green">Share Poster</button>

        <div class="upload-section">
          <h4>Custom Poster Upload</h4>
          <p>Upload JPG or PNG. Your custom poster will be submitted to the administrator for approval.</p>

          ${showPosterStatusHTML(posterStatus)}

          ${customPosterURL ? `
            <img class="poster-preview"
              src="${escapeHTML(customPosterURL)}"
              alt="Uploaded custom poster">
          ` : ""}

          ${posterRecord && posterStatus === "Rejected" ? `
            <p class="small">Your previous poster was rejected. You can upload a new one.</p>
          ` : ""}

          ${posterUploadAllowed ? `
            <input type="file" class="posterFile"
              accept=".jpg,.jpeg,.png,image/jpeg,image/png">
            <button class="uploadBtn">Submit Custom Poster for Approval</button>
          ` : `
            <p class="small">
              A poster submission already exists. You cannot upload another
              until the administrator rejects the current submission.
            </p>
          `}

          <div class="upload-status"></div>
        </div>
      `;

      entry.querySelector(".performerBtn").addEventListener("click", () => {
        window.open(performerLink, "_blank", "noopener");
      });

      entry.querySelector(".audienceBtn").addEventListener("click", () => {
        window.open(audienceLink, "_blank", "noopener");
      });

      entry.querySelector(".detailsBtn").addEventListener("click", event => {
        const details = entry.querySelector(".show-details");
        details.classList.toggle("hidden");
        event.currentTarget.textContent = details.classList.contains("hidden")
          ? "Show Details"
          : "Hide Details";
      });

      entry.querySelector(".posterBtn").addEventListener("click", async () => {
        try {
          await createPoster(show, audienceLink);
        } catch (error) {
          console.error(error);
          alert("Could not generate poster: " + error.message);
        }
      });

      entry.querySelector(".sharePosterBtn").addEventListener("click", async () => {
        try {
          const blob = await createPosterBlob(show, audienceLink);
          const file = new File(
            [blob],
            "Melody-Magic-Show-Poster.png",
            { type: "image/png" }
          );

          if (navigator.canShare && navigator.canShare({ files: [file] }) &&
              navigator.share) {
            await navigator.share({
              title: show.name || "Melody Magic Show",
              text: "Join my show on Melody Magic Digital Auditorium.",
              files: [file]
            });
          } else {
            downloadBlob(blob, "Melody-Magic-Show-Poster.png");
            const shareText =
              "Join my show: " + (show.name || "Music Show") +
              "\nDate: " + formatDate(show.date) +
              "\nTime: " + formatTime12Hour(show.time) + " IST" +
              "\nAudience registration: " + audienceLink;

            window.open(
              "https://wa.me/?text=" + encodeURIComponent(shareText),
              "_blank",
              "noopener"
            );

            alert("Poster downloaded. You can attach the downloaded image to your social media post.");
          }
        } catch (error) {
          if (error.name !== "AbortError") {
            console.error(error);
            alert("Sharing failed: " + error.message);
          }
        }
      });

      if (posterUploadAllowed) {
        const fileInput = entry.querySelector(".posterFile");
        const uploadButton = entry.querySelector(".uploadBtn");
        const uploadStatus = entry.querySelector(".upload-status");

        uploadButton.addEventListener("click", async () => {
          const file = fileInput.files[0];

          if (!file) {
            alert("Please select a poster image first.");
            return;
          }

          const allowedTypes = ["image/jpeg", "image/png"];

          if (!allowedTypes.includes(file.type)) {
            alert("Only JPG, JPEG and PNG images are allowed.");
            return;
          }

          if (file.size > MAX_FILE_SIZE) {
            alert("Poster size must be 5 MB or smaller.");
            return;
          }

          uploadButton.disabled = true;
          uploadButton.textContent = "Uploading...";
          uploadStatus.textContent = "Uploading your poster. Please wait...";

          try {
            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", UPLOAD_PRESET);
            formData.append("folder", "melody-magic-posters");

            const response = await fetch(
              `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
              {
                method: "POST",
                body: formData
              }
            );

            const result = await response.json();

            if (!response.ok) {
              throw new Error(
                result.error?.message || "Cloudinary upload failed."
              );
            }

            if (!validCloudinaryURL(result.secure_url)) {
              throw new Error("Cloudinary returned an invalid image URL.");
            }

            // Submit poster for admin approval.
            // This does not modify the published show record.
            await withTimeout(
              set(ref(db, "showPosters/" + id), {
                hostUid: currentUser.uid,
                showId: id,
                imageUrl: result.secure_url,
                publicId: result.public_id || "",
                status: "Pending",
                submittedAt: Date.now()
              })
            );

            uploadStatus.textContent =
              "Poster uploaded successfully and submitted for admin approval.";

            alert("Your custom poster has been submitted for approval.");
            await loadShows();
            return;

          } catch (error) {
            console.error("Poster upload error:", error);
            uploadStatus.textContent = "Upload failed: " + error.message;
            alert("Could not upload poster: " + error.message);

          } finally {
            uploadButton.disabled = false;
            uploadButton.textContent = "Submit Custom Poster for Approval";
          }
        });
      }

      showsList.appendChild(entry);
    }

  } catch (error) {
    console.error(error);
    showsList.textContent = "Could not load shows: " + error.message;
  }
}

function showPosterStatusHTML(status) {
  return "<p>Custom poster status: " +
    showPosterStatus(status) + "</p>";
}

document.getElementById("createShowBtn").addEventListener("click", async () => {
  const name = document.getElementById("showName").value.trim();
  const description = document.getElementById("showDescription").value.trim();
  const date = document.getElementById("showDate").value;
  const time = document.getElementById("showTime").value;
  const performerFee = Number(document.getElementById("performerFee").value || 0);
  const audienceFee = Number(document.getElementById("audienceFee").value || 0);
  const type = document.getElementById("showType").value;

  if (!currentUser || !currentHost) {
    alert("Your host account is not ready. Please refresh and log in again.");
    return;
  }

  if (!name || !date || !time) {
    alert("Please enter show name, date and time.");
    return;
  }

  if (performerFee < 0 || audienceFee < 0 ||
      !Number.isFinite(performerFee) || !Number.isFinite(audienceFee)) {
    alert("Please enter valid, non-negative fees.");
    return;
  }

  const button = document.getElementById("createShowBtn");
  button.disabled = true;
  button.textContent = "Creating...";
  createMessage.textContent = "";

  try {
    const newShow = push(ref(db, "shows"));

    await withTimeout(set(newShow, {
      hostUid: currentUser.uid,
      hostName: currentHost.name || currentUser.email,
      name,
      description,
      date,
      time,
      timeZone: "Asia/Kolkata",
      timeZoneLabel: "IST",
      performerFee,
      audienceFee,
      type,
      status: "Published",
      createdAt: Date.now()
    }));

    alert("Your show has been created.");

    document.getElementById("showName").value = "";
    document.getElementById("showDescription").value = "";
    document.getElementById("showDate").value = "";
    document.getElementById("showTime").value = "";

    await loadShows();

  } catch (error) {
    console.error("Show creation error:", error);
    createMessage.textContent = "Error: " + error.message;
    alert("Could not create show: " + error.message);

  } finally {
    button.disabled = false;
    button.textContent = "Create Show";
  }
});

/* Generate QR code, draw it on the poster, and return a PNG blob. */
async function createPosterBlob(show, link) {
  if (typeof QRCode === "undefined") {
    throw new Error("QR code library did not load. Check your internet connection and try again.");
  }

  const qrHolder = document.createElement("div");
  qrHolder.style.position = "fixed";
  qrHolder.style.left = "-10000px";
  qrHolder.style.top = "0";
  document.body.appendChild(qrHolder);

  try {
    new QRCode(qrHolder, {
      text: link,
      width: 220,
      height: 220,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });

    await new Promise(resolve => setTimeout(resolve, 300));

    let qrCanvas = qrHolder.querySelector("canvas");

    if (!qrCanvas) {
      const qrImage = qrHolder.querySelector("img");

      if (!qrImage) {
        throw new Error("Could not create the QR code.");
      }

      await new Promise((resolve, reject) => {
        if (qrImage.complete) return resolve();
        qrImage.onload = resolve;
        qrImage.onerror = reject;
      });

      qrCanvas = document.createElement("canvas");
      qrCanvas.width = 220;
      qrCanvas.height = 220;
      qrCanvas.getContext("2d").drawImage(qrImage, 0, 0, 220, 220);
    }

    const canvas = document.createElement("canvas");
    canvas.width = 1080;
    canvas.height = 1350;

    const ctx = canvas.getContext("2d");
    const gradient = ctx.createLinearGradient(0, 0, 1080, 1350);
    gradient.addColorStop(0, "#111a35");
    gradient.addColorStop(1, "#401b45");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 1080, 1350);

    // Decorative border
    ctx.strokeStyle = "#f5bd43";
    ctx.lineWidth = 8;
    ctx.strokeRect(35, 35, 1010, 1280);

    ctx.textAlign = "center";
    ctx.fillStyle = "#f5bd43";
    ctx.font = "bold 58px Arial";
    ctx.fillText("MELODY MAGIC", 540, 135);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 42px Arial";
    ctx.fillText("DIGITAL AUDITORIUM", 540, 200);

    ctx.fillStyle = "#f5bd43";
    ctx.font = "bold 35px Arial";
    ctx.fillText("PRESENTS", 540, 280);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 62px Arial";
    drawWrappedText(ctx, show.name || "Music Show", 540, 405, 900, 78);

    ctx.fillStyle = "#f5bd43";
    ctx.font = "bold 38px Arial";
    ctx.fillText("SHOW DETAILS", 540, 620);

    ctx.fillStyle = "#ffffff";
    ctx.font = "36px Arial";
    ctx.fillText(formatDate(show.date), 540, 690);
    ctx.fillText(formatTime12Hour(show.time) + " IST", 540, 755);

    ctx.font = "30px Arial";
    ctx.fillText(
      "Performer Entry: " + (Number(show.performerFee || 0) === 0
        ? "FREE"
        : "Rs. " + Number(show.performerFee)),
      540, 840
    );

    ctx.fillText(
      "Audience Entry: " + (Number(show.audienceFee || 0) === 0
        ? "FREE"
        : "Rs. " + Number(show.audienceFee)),
      540, 900
    );

    // QR code white panel
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(420, 950, 240, 240);
    ctx.drawImage(qrCanvas, 430, 960, 220, 220);

    ctx.fillStyle = "#f5bd43";
    ctx.font = "bold 28px Arial";
    ctx.fillText("SCAN TO JOIN THE SHOW", 540, 1230);

    ctx.fillStyle = "#ffffff";
    ctx.font = "22px Arial";
    ctx.fillText("All timings in Indian Standard Time (IST)", 540, 1275);

    return await new Promise((resolve, reject) => {
      canvas.toBlob(blob => {
        if (blob) resolve(blob);
        else reject(new Error("Could not create poster image."));
      }, "image/png");
    });

  } finally {
    qrHolder.remove();
  }
}

async function createPoster(show, link) {
  const blob = await createPosterBlob(show, link);
  downloadBlob(blob, "Melody-Magic-Show-Poster.png");
  alert("Your promotional poster has been generated and downloaded.");
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = String(text).split(/\s+/);
  let line = "";
  let currentY = y;

  for (const word of words) {
    const test = line ? line + " " + word : word;

    if (ctx.measureText(test).width > maxWidth && line) {
      ctx.fillText(line, x, currentY);
      line = word;
      currentY += lineHeight;
    } else {
      line = test;
    }
  }

  if (line) ctx.fillText(line, x, currentY);
}
